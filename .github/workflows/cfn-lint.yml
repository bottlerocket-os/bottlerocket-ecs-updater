name: cfn-lint
on:
  push:
    paths:
      - 'stacks/*'
      - 'integ/stacks/*'
  pull_request:
    paths:
      - 'stacks/*'
      - 'integ/stacks/*'
jobs:
  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - run: pip install cfn-lint
      - run: make cfn-lint

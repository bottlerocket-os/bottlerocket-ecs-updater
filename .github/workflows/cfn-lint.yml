name: cfn-lint
on:
  push:
    paths:
      - 'stacks/*'
      - 'integ/stacks/*'
  pull_request:
    paths:
      - 'stacks/*'
      - 'integ/stacks/*'
jobs:
  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: pip install cfn-lint
      - run: make cfn-lint
